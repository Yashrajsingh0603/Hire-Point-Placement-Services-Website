<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post a Job | HireHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 30px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .company-actions {
            margin-top: 10px;
        }

        .new-company-box {
            display: none;
            margin-top: 12px;
        }

        .new-company-box small {
            display: block;
            margin-top: 6px;
            color: #6b7280;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-add {
            background: #eef2ff;
            color: #3730a3;
        }

        .btn-add:hover {
            background: #e0e7ff;
        }

        .btn-submit {
            width: 100%;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {
            .row {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Post a New Job</h1>

        <p class="subtitle">
            Add a job opening and reach talented candidates.
        </p>

        <form method="POST">

            <!-- JOB TITLE -->
            <div class="form-group">

                <label for="title">
                    Job Title *
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="e.g. Python Developer"
                    required
                >

            </div>


            <!-- COMPANY -->
            <div class="form-group">

                <label for="company_name">
                    Company Name *
                </label>

                <input
                    type="text"
                    id="company_name"
                    name="company_name"
                    placeholder="Enter any company name"
                    required
                >

                <small style="color:#6b7280;">
                    You can enter any company name. If it already exists,
                    HireHub will use the existing company.
                </small>

            </div>


            <!-- LOCATION + JOB TYPE -->
            <div class="row">

                <div class="form-group">

                    <label for="location">
                        Location *
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Gurgaon, Delhi"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="job_type">
                        Job Type *
                    </label>

                    <select
                        id="job_type"
                        name="job_type"
                        required
                    >

                        <option value="">
                            Select Job Type
                        </option>

                        <option value="Full Time">
                            Full Time
                        </option>

                        <option value="Part Time">
                            Part Time
                        </option>

                        <option value="Internship">
                            Internship
                        </option>

                        <option value="Contract">
                            Contract
                        </option>

                    </select>

                </div>

            </div>


            <!-- SALARY -->
            <div class="row">

                <div class="form-group">

                    <label for="salary_min">
                        Minimum Salary
                    </label>

                    <input
                        type="number"
                        id="salary_min"
                        name="salary_min"
                        placeholder="e.g. 30000"
                        min="0"
                    >

                </div>


                <div class="form-group">

                    <label for="salary_max">
                        Maximum Salary
                    </label>

                    <input
                        type="number"
                        id="salary_max"
                        name="salary_max"
                        placeholder="e.g. 60000"
                        min="0"
                    >

                </div>

            </div>


            <!-- EXPERIENCE -->
            <div class="form-group">

                <label for="experience">
                    Experience
                </label>

                <input
                    type="text"
                    id="experience"
                    name="experience"
                    placeholder="e.g. 0-2 Years"
                >

            </div>


            <!-- SKILLS -->
            <div class="form-group">

                <label for="skills">
                    Required Skills
                </label>

                <input
                    type="text"
                    id="skills"
                    name="skills"
                    placeholder="e.g. Python, Flask, PostgreSQL"
                >

            </div>


            <!-- DESCRIPTION -->
            <div class="form-group">

                <label for="description">
                    Job Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Write complete job description..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn btn-submit"
            >
                Post Job
            </button>

        </form>

    </div>

</div>

</body>
</html>
