<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {{ 'Edit User' if user else 'Add User' }} - HireHub
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            Hire<span>Hub</span>
        </div>


        <nav>

            <a href="/">
                Website
            </a>

            <a href="/admin/users">
                Users
            </a>

        </nav>


        <div class="nav-buttons">

            <a href="/admin/users"
               class="login-btn">

                Back to Users

            </a>

        </div>

    </header>



    <!-- ================= FORM ================= -->

    <main class="admin-container">


        <div class="register-card admin-form-card">


            <div class="register-header">

                <p class="small-heading">
                    ADMINISTRATION
                </p>


                <h1>

                    {{ 'Edit User' if user else 'Add New User' }}

                </h1>


                <p>

                    {% if user %}

                        Update the user's information below.

                    {% else %}

                        Create a new HireHub user account.

                    {% endif %}

                </p>

            </div>



            <form method="POST">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>


                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user[1] if user else '' }}"
                        placeholder="Enter full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user[2] if user else '' }}"
                        placeholder="Enter email address"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"

                        {% if user %}

                            placeholder="Leave blank to keep current password"

                        {% else %}

                            placeholder="Create a password"
                            required

                        {% endif %}

                    >

                </div>



                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Account Role
                    </label>


                    <select id="role"
                            name="role">


                        <option
                            value="job_seeker"

                            {% if user and user[3] == 'job_seeker' %}
                                selected
                            {% endif %}
                        >

                            Job Seeker

                        </option>



                        <option
                            value="employer"

                            {% if user and user[3] == 'employer' %}
                                selected
                            {% endif %}
                        >

                            Employer

                        </option>



                        <option
                            value="admin"

                            {% if user and user[3] == 'admin' %}
                                selected
                            {% endif %}
                        >

                            Admin

                        </option>


                    </select>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-submit">

                    {% if user %}

                        Update User

                    {% else %}

                        Create User

                    {% endif %}

                </button>


            </form>



            <div style="text-align: center; margin-top: 20px;">

                <a href="/admin/users">

                    ← Back to User Management

                </a>

            </div>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">

            Hire<span>Hub</span>

        </div>


        <p>

            HireHub Administration Panel

        </p>

    </footer>


</body>

</html>
