{% extends "base.html" %}

{% block title %}Create Account | HireHub{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <span class="auth-badge">
                    JOIN HIREHUB
                </span>

                <h1>Create Account</h1>

                <p>
                    Create your account and start using HireHub.
                </p>

            </div>


            <form method="POST" action="{{ url_for('register') }}">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Role -->
                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="job_seeker">
                            Job Seeker
                        </option>

                        <option value="employer">
                            Employer
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>

{% endblock %}
