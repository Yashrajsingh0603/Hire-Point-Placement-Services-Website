{% extends "base.html" %}

{% block title %}Login | JobPortal{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-logo">
                J
            </div>

            <h1>Welcome back</h1>

            <p>
                Login to your JobPortal account and continue your career journey.
            </p>

        </div>


        <div class="auth-card">

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Login
                </button>

            </form>


            <div class="auth-divider">
                <span>New to JobPortal?</span>
            </div>


            <a
                href="{{ url_for('register') }}"
                class="auth-login-link"
            >
                Create a new account
            </a>

        </div>


        <p class="auth-footer-text">
            Secure login powered by JobPortal.
        </p>

    </div>

</section>

{% endblock %}
